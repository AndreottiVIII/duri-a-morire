<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<!-- I quattro tasti colorati del Televideo, gli stessi della barra in fondo.
     Incorporato nella pagina: il sito resta un file solo. -->
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAVUlEQVR42u3VMQoAIAxD0UQ8ifc/k1fRxUHH4lDB380h+LBCLGkocYqSJx1Q98NoLRR27ysYvNWsAAAAAAAeAvj7Oj7bMPgW9m2QTwgAAAAAtCErkCaOmQs/KFHCIgAAAABJRU5ErkJggg==">
<title>%%TITOLO%%</title>
<style>
  :root{
    --nero:#000; --bianco:#fff; --giallo:#ff0; --ciano:#0ff;
    --verde:#0f0; --magenta:#f0f; --rosso:#f22; --blu:#00f;
    --spento:#6f6f6f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0a0a0a;color:var(--bianco);
    font-family:"Cascadia Mono","Consolas","DejaVu Sans Mono","Liberation Mono",monospace;}
  body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px 6px 24px}

  #tv{position:relative;background:var(--nero);border-radius:6px;padding:10px 8px;
    width:100%;max-width:44em;font-size:min(4.1vw,20px);line-height:1.25;
    box-shadow:0 0 0 2px #222, 0 0 30px rgba(0,255,255,.07)}
  /* righe di scansione: appena accennate, non deve dare fastidio a leggere */
  #tv::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:6px;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px)}
  pre#schermo{margin:0;white-space:pre;overflow-x:auto;text-shadow:0 0 6px currentColor}

  .b{color:var(--bianco)} .g{color:var(--giallo)} .c{color:var(--ciano)}
  .v{color:var(--verde)} .m{color:var(--magenta)} .r{color:var(--rosso)}
  .d{color:var(--spento);text-shadow:none}
  .inv{background:var(--ciano);color:#000;text-shadow:none}
  .invg{background:var(--giallo);color:#000;text-shadow:none}
  .invr{background:var(--rosso);color:#000;text-shadow:none}
  a.n{color:inherit;text-decoration:none;cursor:pointer}
  a.n:hover,a.n:focus{background:var(--giallo);color:#000;text-shadow:none;outline:none}
  /* le voci di menu vanno sottolineate: senza il passaggio del mouse, sul
     telefono niente diceva che fossero da toccare */
  a.n[data-p]{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}

  #extra{max-width:44em;width:100%;margin-top:10px;display:flex;gap:14px;align-items:flex-start}
  #extra img{width:130px;border:2px solid var(--ciano);filter:grayscale(1) contrast(1.35) brightness(.95);
    image-rendering:pixelated}
  #extra .via{font-size:13px;line-height:1.5}
  #extra a{color:var(--ciano)}

  #comandi{max-width:44em;width:100%;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  #comandi input{background:#111;border:1px solid #333;color:var(--bianco);padding:7px 9px;
    font:inherit;font-size:15px;border-radius:3px}
  #pag{width:6.5em} #cerca{flex:1;min-width:9em}
  #comandi button{background:#111;border:1px solid var(--ciano);color:var(--ciano);
    font:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:3px;cursor:pointer}
  #comandi button:hover{background:var(--ciano);color:#000}
  .fast{display:flex;gap:0;width:100%;max-width:44em;margin-top:8px}
  .fast button{flex:1;border:0;padding:8px 4px;font:inherit;font-size:13px;font-weight:700;
    color:#000;cursor:pointer;letter-spacing:.03em}
  .fast .f1{background:var(--rosso)} .fast .f2{background:var(--verde)}
  .fast .f3{background:var(--giallo)} .fast .f4{background:var(--ciano)}
  .fast button:hover{filter:brightness(1.25)}
  #sub{max-width:44em;width:100%;margin-top:8px;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--spento)}
  #sub button{background:#111;border:1px solid #333;color:var(--ciano);font:inherit;font-size:14px;
    padding:5px 12px;border-radius:3px;cursor:pointer}
  #sub button:disabled{opacity:.3;cursor:default}
  footer{max-width:44em;width:100%;margin-top:18px;font-size:12px;color:var(--spento);line-height:1.6}
  footer a{color:var(--spento)}
  #colofone a{color:var(--ciano);text-decoration:none;border-bottom:1px dotted var(--spento);cursor:pointer}
  #colofone a:hover{border-bottom-color:var(--ciano)}
</style>
</head>
<body>

<div id="tv"><pre id="schermo"></pre></div>
<div id="extra"></div>
<div id="sub">
  <button id="prev">&larr;</button><span id="subetichetta"></span><button id="next">&rarr;</button>
</div>
<div id="comandi">
  <input id="pag" inputmode="numeric" placeholder="pagina" maxlength="3" aria-label="numero di pagina">
  <input id="cerca" placeholder="cerca un nome…" aria-label="cerca un nome">
  <button id="aggiorna" title="ricontrolla su Wikidata chi e' ancora vivo">AGGIORNA</button>
</div>
<div class="fast">
  <button class="f1" data-p="100">100 INDICE</button>
  <button class="f2" data-p="101">101 VIVENTI</button>
  <button class="f3" data-p="200">200 STATISTICHE</button>
  <button class="f4" data-p="130">130 HALL OF FAME</button>
</div>
<footer>
  Dati da Wikidata, la versione interrogabile di Wikipedia. Foto da Wikimedia Commons.
  <span id="pieno"></span>
  <span id="colofone"></span>
</footer>

<script>
const DATI = /*__DATI__*/;
const TESTATA = '%%TESTATA%%';
const COLOFONE = /*__COLOFONE__*/;
const W = 40, RIGHE_LISTA = 18;
const P = DATI.persone;
const perQid = {}; P.forEach(p => perQid[p.q] = p);
const OGGI = new Date();
const NOMI_PARTITI = DATI.nomi_partiti || {};
const perEsteso = s => NOMI_PARTITI[s] || '';

/* ---------- costruzione delle righe, rigorosamente a 40 colonne ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const tronca = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const sp = n => ' '.repeat(Math.max(0, n));

function seg(t, c){ return {t: String(t), c: c || 'b'}; }
function rigaHtml(segs){
  let len = segs.reduce((a, s) => a + s.t.length, 0);
  let out = segs.map(s => '<span class="' + s.c + '">' + esc(s.t) + '</span>').join('');
  return out + sp(W - len);
}
function sxdx(sx, dx, cs, cd){
  const spazio = W - sx.length - dx.length;
  return [seg(sx, cs), seg(sp(spazio)), seg(dx, cd)];
}
function centro(t, c){
  const l = Math.floor((W - t.length) / 2);
  return [seg(sp(l)), seg(t, c)];
}
function titolo(t){ return [seg(' ' + tronca(t, W - 2).padEnd(W - 1), 'invg')]; }
function vuota(){ return [seg('')]; }

/* Manda a capo per parole dentro le 40 colonne: il primo rientro per la riga
   d'apertura, il secondo per quelle che seguono. */
function avvolgi(testo, rientro, rientroSeguito){
  const righe = [];
  let linea = rientro;
  String(testo).split(/\s+/).forEach(parola => {
    if(linea.trim() && (linea + parola).length > W - 1){
      righe.push(linea);
      linea = rientroSeguito;
    }
    linea += parola + ' ';
  });
  if(linea.trim()) righe.push(linea.replace(/\s+$/, ''));
  return righe;
}

/* ---------- date, età, precisione ---------- */
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function dataIt(s, prec){
  if(!s) return '?';
  if(prec === 'anno' || s.length === 4) return s;
  if(prec === 'mese' || s.length === 7) return MESI[+s.slice(5,7)-1] + ' ' + s.slice(0,4);
  return (+s.slice(8,10)) + ' ' + MESI[+s.slice(5,7)-1] + ' ' + s.slice(0,4);
}
function anno(s){ return s ? +s.slice(0,4) : null; }
function eta(p){
  if(!p.b) return null;
  const fine = p.d ? new Date(p.d.length>=10 ? p.d : p.d.slice(0,4)+'-07-01') : OGGI;
  const nas = new Date(p.b.length>=10 ? p.b : p.b.slice(0,4)+'-07-01');
  let a = fine.getFullYear() - nas.getFullYear();
  const m = fine.getMonth() - nas.getMonth();
  if(m < 0 || (m === 0 && fine.getDate() < nas.getDate())) a--;
  return a;
}
const STATO = {1:['VIVO','v'], 2:['','d'], 3:['IGNOTO','m']};

/* ---------- riga di una persona ---------- */
function rigaPersona(p){
  const cls = p.s === 1 ? 'b' : (p.s === 3 ? 'm' : 'd');
  const nome = tronca(p.n, 25).padEnd(25);
  const an = String(anno(p.b) || '????');
  const part = tronca(p.p || '', 6).padStart(6);
  const marchio = p.h ? '■' : ' ';
  return [
    seg(' '), seg(marchio, p.h ? 'g' : 'b'),
    {t: nome, c: cls, link: p.q},
    seg(' '), seg(an, cls), seg(part, p.s === 1 ? 'c' : 'd')
  ];
}
function rigaHtmlConLink(segs){
  let len = segs.reduce((a, s) => a + s.t.length, 0);
  let out = segs.map(s => {
    const dentro = '<span class="' + (s.c||'b') + '">' + esc(s.t) + '</span>';
    if(s.link) return '<a class="n" data-q="' + s.link + '" href="#' + s.link + '">' + dentro + '</a>';
    if(s.pag)  return '<a class="n" data-p="' + s.pag + '" href="#p' + s.pag + '">' + dentro + '</a>';
    if(s.el)   return '<a class="n" data-l="' + esc(s.el) + '" href="#l/' +
                      esc(encodeURIComponent(s.el)) + '">' + dentro + '</a>';
    return dentro;
  }).join('');
  return out + sp(W - len);
}

/* Una voce di menu: il numero e la dicitura sono un unico bersaglio da toccare.
   Sul Televideo vero si digitava il numero; qui deve bastare il dito. */
function vocemenu(num, testo, valore, clsValore){
  const sx = ' ' + num + ' ' + testo;
  const dx = valore || '';
  return [{t: sx, c: 'g', pag: num}, seg(sp(W - sx.length - dx.length)),
          seg(dx, clsValore || 'b')];
}

/* ---------- selezioni di comodo ----------
   Sono ricalcolabili, non fisse: il tasto "aggiorna" puo' spostare qualcuno
   dai vivi ai morti mentre la pagina e' aperta. */
const perMandato = m => P.filter(p => p.m.indexOf(m) >= 0);
// Un governo non e' una legislatura: i tecnici di Ciampi e Dini non hanno mai
// avuto un seggio, e vanno contati zero.
const legislatureDi = p => p.m.filter(m => m.indexOf('Governo') !== 0);
const governiDi = p => p.m.filter(m => m.indexOf('Governo') === 0);
const perNascita = a => a.slice().sort((x, y) => (x.b||'9') < (y.b||'9') ? -1 : 1);
let viventi, defunti, ignoti, hof, hofVivi, hofMorti;
function ricalcola(){
  viventi = P.filter(p => p.s === 1);
  defunti = P.filter(p => p.s === 2);
  ignoti  = P.filter(p => p.s === 3);
  hof     = P.filter(p => p.h);
  hofVivi  = perNascita(hof.filter(p => p.s === 1));
  hofMorti = hof.filter(p => p.s === 2 && p.d).sort((a, b) => a.d < b.d ? 1 : -1);
}
ricalcola();

/* Impagina righe gia' composte, non persone: serve alle pagine che alternano
   una riga di intestazione e due di dettaglio. */
function paginaRighe(fnRighe, intestazione, fnNota){
  return function(sub){
    const tutte = fnRighe();
    const nota = typeof fnNota === 'function' ? fnNota() : fnNota;
    const n = Math.max(1, Math.ceil(tutte.length / RIGHE_LISTA));
    const r = [titolo(intestazione)];
    if(nota){ r.push([seg(' ' + tronca(nota, W - 2), 'c')]); }
    r.push(vuota());
    tutte.slice(sub * RIGHE_LISTA, (sub + 1) * RIGHE_LISTA).forEach(x => r.push(x));
    return {righe: r, sottopagine: n};
  };
}

/* Come paginaRighe, ma le righe arrivano gia' raggruppate e un gruppo non
   viene mai spezzato fra due sottopagine: un partito con la sua data di
   estinzione e il nome dell'ultimo deve stare tutto insieme. */
function paginaBlocchi(fnBlocchi, intestazione, fnNota){
  return function(sub){
    const blocchi = fnBlocchi();
    const pagine = [[]];
    blocchi.forEach(b => {
      const ultima = pagine[pagine.length - 1];
      if(ultima.length && ultima.length + b.length > RIGHE_LISTA) pagine.push([]);
      pagine[pagine.length - 1].push.apply(pagine[pagine.length - 1], b);
    });
    const nota = typeof fnNota === 'function' ? fnNota() : fnNota;
    const r = [titolo(intestazione)];
    if(nota) r.push([seg(' ' + tronca(nota, W - 2), 'c')]);
    r.push(vuota());
    (pagine[Math.min(sub, pagine.length - 1)] || []).forEach(x => r.push(x));
    return {righe: r, sottopagine: pagine.length};
  };
}

/* ---------- impaginazione di una lista lunga ----------
   L'elenco e la nota arrivano come funzioni, cosi' ogni pagina rilegge i dati
   al momento del disegno invece di fotografarli all'avvio. */
function paginaLista(fnElenco, intestazione, fnNota){
  return function(sub){
    const elenco = typeof fnElenco === 'function' ? fnElenco() : fnElenco;
    const nota = typeof fnNota === 'function' ? fnNota() : fnNota;
    const n = Math.max(1, Math.ceil(elenco.length / RIGHE_LISTA));
    const fetta = elenco.slice(sub * RIGHE_LISTA, (sub + 1) * RIGHE_LISTA);
    const r = [titolo(intestazione)];
    if(nota){ r.push([seg(' ' + tronca(nota, W-2), 'c')]); }
    r.push(vuota());
    fetta.forEach(p => r.push(rigaPersona(p)));
    return {righe: r, sottopagine: n};
  };
}

/* ---------- le pagine ---------- */
const PAGINE = {};

PAGINE[100] = () => {
  const compleanni = compleanniDi(OGGI);
  const r = [
    titolo('INDICE'),
    [seg(' chi è ancora vivo e chi no', 'c')],
    [seg(' della Prima Repubblica', 'c')],
    vocemenu(101, 'VIVENTI', String(viventi.length), 'b'),
    vocemenu(300, 'IN MEMORIAM', String(defunti.length), 'd'),
    vocemenu(400, 'SORTE IGNOTA', String(ignoti.length), 'm'),
    vuota(),
    vocemenu(130, 'HALL OF FAME',
             hof.filter(p => p.s === 1).length + '/' + hof.length, 'g'),
    vocemenu(110, 'PER LEGISLATURA'),
    vocemenu(200, 'STATISTICHE'),
    vocemenu(500, 'COMPLEANNI'),
    vocemenu(150, 'RICERCA'),
    vocemenu(600, 'RICONTROLLA ORA'),
    vuota(),
  ];
  if(compleanni.length){
    r.push([seg(' OGGI COMPIE GLI ANNI', 'invr')]);
    compleanni.slice(0, 3).forEach(p => r.push([
      seg('  '), {t: tronca(p.n, 27).padEnd(27), c: 'b', link: p.q},
      seg(String(eta(p)).padStart(3), 'g'), seg(' anni', 'g')]));
  } else {
    r.push([seg(' Oggi non compie gli anni nessuno.', 'd')]);
  }
  r.push(vuota());
  r.push([seg(' aggiornato il ' + dataIt(DATI.generato), 'd')]);
  if(COLOFONE) r.push([{t: ' 700 chi fa questo sito', c: 'd', pag: 700}]);
  return {righe: r, sottopagine: 1};
};

PAGINE[101] = paginaLista(() => perNascita(viventi), 'VIVENTI — dal più anziano',
  '■ = hall of fame. Tocca un nome.');

PAGINE[110] = () => {
  const r = [titolo('PER LEGISLATURA'), vuota()];
  DATI.legislature.forEach((L, i) => {
    const gente = perMandato(L[0]);
    const vivi = gente.filter(p => p.s === 1).length;
    const num = 111 + i;
    r.push([
      {t: ' ' + num + ' ' + tronca(L[0], 14).padEnd(15), c: 'g', pag: num},
      seg(L[1].padEnd(8), 'd'),
      seg(String(vivi).padStart(4), vivi ? 'c' : 'r'),
      seg(vivi ? ' vivi' : ' —', vivi ? 'c' : 'r')
    ]);
  });
  return {righe: r, sottopagine: 1};
};
DATI.legislature.forEach((L, i) => {
  PAGINE[111 + i] = paginaLista(() => perNascita(perMandato(L[0])),
    'LEG. ' + L[0] + '  ' + L[1],
    () => perMandato(L[0]).filter(p => p.s === 1).length +
          ' viventi su ' + perMandato(L[0]).length);
});

/* ---------- sezione hall of fame: i 66 curati a mano ---------- */
PAGINE[130] = () => {
  const ultimo = hofMorti[0];
  const r = [
    titolo('HALL OF FAME'),
    [seg(' la lista curata a mano', 'c')],
    vuota(),
    vocemenu(131, 'ANCORA IN PIEDI', String(hofVivi.length), 'v'),
    vocemenu(132, 'IN MEMORIAM', String(hofMorti.length), 'd'),
    vocemenu(133, 'PER PARTITO'),
    vocemenu(134, 'COMPLEANNI'),
    vocemenu(135, 'PIÙ INCARICHI'),
    vocemenu(250, 'PIÙ LEGISLATURE (TUTTI)'),
    vuota(),
  ];
  if(ultimo){
    r.push([seg(' L’ULTIMO PERDUTO', 'invr')]);
    r.push([seg('  '), {t: tronca(ultimo.n, 27).padEnd(27), c: 'b', link: ultimo.q},
            seg(String(anno(ultimo.d)).padStart(5), 'r')]);
    r.push([seg('  ' + dataIt(ultimo.d, ultimo.dp), 'd')]);
  }
  return {righe: r, sottopagine: 1};
};

PAGINE[131] = paginaLista(() => hofVivi, 'H.F. — ANCORA IN PIEDI',
  () => hofVivi.length + ' su 66, dal più anziano');
PAGINE[132] = paginaLista(() => hofMorti, 'H.F. — IN MEMORIAM',
  () => hofMorti.length + ' su 66, dal più recente');

PAGINE[133] = () => {
  const conta = {};
  hof.forEach(p => {
    if(!p.p) return;
    conta[p.p] = conta[p.p] || [0, 0];
    conta[p.p][0]++;
    if(p.s === 1) conta[p.p][1]++;
  });
  const ordinate = Object.keys(conta).map(k => [k, conta[k][0], conta[k][1]])
    .sort((a, b) => b[1] - a[1]);
  const r = [titolo('H.F. — PER PARTITO'),
    [seg(' in totale, e quanti ne restano', 'c')], vuota()];
  const max = Math.max.apply(null, ordinate.map(o => o[1])) || 1;
  ordinate.forEach(o => {
    const largo = 16, vivi = Math.round(o[2] / max * largo);
    const tot = Math.max(1, Math.round(o[1] / max * largo));
    const esteso = perEsteso(o[0]);
    if(esteso) r.push([seg('  ' + tronca(esteso, W - 3), 'd')]);
    r.push([seg(' ' + tronca(o[0], 6).padEnd(7), 'b'),
            seg('█'.repeat(vivi), 'v'),
            seg('█'.repeat(Math.max(0, tot - vivi)), 'd'),
            seg(sp(largo - tot)),
            o[2] ? {t: String(o[2]).padStart(4), c: 'v', el: 'hof:' + o[0]}
                 : seg(String(o[2]).padStart(4), 'v'),
            seg('/' + o[1], 'd')]);
  });
  r.push(vuota());
  r.push([seg(' verde = vivi   grigio = perduti', 'd')]);
  return {righe: r, sottopagine: 1};
};

function chiaveCompleanno(p){
  const m = +p.b.slice(5, 7) - 1, g = +p.b.slice(8, 10);
  let d = new Date(OGGI.getFullYear(), m, g);
  if(d < new Date(OGGI.getFullYear(), OGGI.getMonth(), OGGI.getDate()))
    d = new Date(OGGI.getFullYear() + 1, m, g);
  return d;
}
function righeCompleanni(elenco, quanti){
  return elenco.filter(p => p.bp === 'giorno')
    .sort((a, b) => chiaveCompleanno(a) - chiaveCompleanno(b))
    .slice(0, quanti).map(p => {
      const d = chiaveCompleanno(p);
      return [seg('  '), {t: tronca(p.n, 22).padEnd(22), c: 'b', link: p.q},
        seg((d.getDate() + ' ' + MESI[d.getMonth()]).padStart(8), 'c'),
        seg(String(d.getFullYear() - anno(p.b)).padStart(5), 'g')];
    });
}

PAGINE[134] = () => {
  const oggi = compleanniDi(OGGI).filter(p => p.h);
  const r = [titolo('H.F. — COMPLEANNI'), vuota()];
  if(oggi.length){
    r.push([seg(' OGGI', 'invr')]);
    oggi.forEach(p => r.push([seg('  '), {t: tronca(p.n, 27).padEnd(27), c: 'g', link: p.q},
      seg(String(eta(p)).padStart(3), 'g'), seg(' anni', 'g')]));
    r.push(vuota());
  }
  r.push([seg(' PROSSIMI', 'invg')]);
  return {righe: r.concat(righeCompleanni(hofVivi, 14)), sottopagine: 1};
};

// Quante legislature si e' fatto ognuno. Vale per tutti, ministri compresi:
// chi ha fatto il ministro senza mai un seggio conta zero, ed e' giusto cosi'.
function classificaLegislature(gente, intestazione, nota){
  return paginaRighe(() => {
    const ordinata = gente().map(p => [p, legislatureDi(p).length])
      .filter(c => c[1] > 0)
      .sort((a, b) => b[1] - a[1] || (a[0].n < b[0].n ? -1 : 1));
    return ordinata.map(c => [
      seg(' '), seg(c[0].h ? '■' : ' ', 'g'),
      {t: tronca(c[0].n, 25).padEnd(25), c: c[0].s === 1 ? 'b' : 'd', link: c[0].q},

function istogramma(coppie, larghezza){
  const max = Math.max.apply(null, coppie.map(c => c[1])) || 1;
  return coppie.map(c => {
    const n = Math.max(1, Math.round(c[1] / max * larghezza));
    const cifra = String(c[1]).padStart(5);
    return [seg(' ' + tronca(c[0], 7).padEnd(8), 'b'),
            seg('█'.repeat(n), 'c'), seg(sp(larghezza - n)),
            c[2] && c[1] ? {t: cifra, c: 'g', el: c[2]} : seg(cifra, 'g')];
  });
}

/* ---------- scheda personale ---------- */
function scheda(q){
  const p = perQid[q];
  if(!p) return {righe: [titolo('NON TROVATO')], sottopagine: 1};
  const r = [titolo(tronca(p.n, W - 2))];
  const st = p.s === 1 ? ['VIVENTE', 'invg'] : (p.s === 3 ? ['SORTE IGNOTA', 'inv'] : ['DECEDUTO', 'invr']);
  if(p.di){
    r.push([seg(' ' + st[0] + ' ', st[1])]);
    r.push(vuota());
    r.push([seg(' Nessuna delle tre fonti ne registra', 'd')]);
    r.push([seg(' la morte, ma avrebbe ' + (OGGI.getFullYear() - anno(p.b)) + ' anni.', 'd')]);
    r.push(vuota());
    r.push(sxdx(' Nascita', dataIt(p.b, p.bp), 'b', 'c'));
    return {righe: r, sottopagine: 1, persona: p};
  }
  r.push([seg(' ' + st[0] + ' ', st[1])]);
  r.push(vuota());
  r.push(sxdx(' Nascita', dataIt(p.b, p.bp), 'b', 'c'));
  if(p.d) r.push(sxdx(' Morte', dataIt(p.d, p.dp), 'b', 'r'));
  else if(p.di) r.push(sxdx(' Morte', 'data ignota', 'b', 'r'));
  // quando la morte non viene da Wikidata vale la pena dire chi l'ha registrata
  if(p.fd) r.push([seg(' via ' + tronca(p.fd, W - 6), 'd')]);
  const e = eta(p);
  if(e !== null) r.push(sxdx(p.d ? ' Aveva' : ' Ha', e + ' anni', 'b', 'g'));
  // Quando una fonte lo dava per morto e il registro la smentisce, si dice.
  if(p.md){
    r.push([seg(' Wikidata lo dava per morto nel ' + p.md[0] + ',', 'd')]);
    r.push([seg(' il registro ' + tronca(p.md[1], 18) + ' no.', 'd')]);
    r.push(vuota());
  }
  if(p.p){
    r.push(sxdx(' Partito', p.p, 'b', 'c'));
    if(perEsteso(p.p)) r.push([seg('  ' + tronca(perEsteso(p.p), W - 3), 'd')]);
  }
  r.push(vuota());
  const leg = legislatureDi(p), gov = governiDi(p);
  if(leg.length){
    r.push([seg(' LEGISLATURE: ' + leg.length + ' ', 'invg')]);
    avvolgi(leg.join('  '), '  ', '  ').forEach(l => r.push([seg(l, 'c')]));
  }
  if(gov.length){
    r.push([seg(' GOVERNI', 'invg')]);
    avvolgi(gov.map(g => g.replace('Governo ', '')).join('  '), '  ', '  ')
      .forEach(l => r.push([seg(l, 'c')]));
  }
  if(p.x) r.push([seg(' (mai eletto: dentro ma sulla porta)', 'm')]);
  // Un'unica sezione di incarichi: prima quelli datati presi dalla fonte,
  // poi cio' che solo il cursus curato sa (segretari di partito, sindacati,
  // Banca d'Italia). Se non avanza niente, la seconda parte non compare.
  if(p.cd || p.cr){
    r.push(vuota());
    r.push([seg(' CARICHE', 'invg')]);
  }
  if(p.cd){
    p.cd.forEach(c => {
      const anni = c[1] ? (c[2] && c[2] !== c[1] ? c[1] + '-' + c[2] : c[1] + '-') : '';
      const largo = W - 2 - (anni.length + 1);
      let riga = '  ', prima = true;
      c[0].split(' ').forEach(parola => {
        if((riga + parola).length > (prima ? largo : W - 2)){
          r.push(prima ? [seg(riga.padEnd(W - anni.length - 1), 'b'), seg(anni, 'c')]
                       : [seg(riga, 'b')]);
          riga = '   '; prima = false;
        }
        riga += parola + ' ';
      });
      if(riga.trim())
        r.push(prima ? [seg(riga.padEnd(W - anni.length - 1), 'b'), seg(anni, 'c')]
                     : [seg(riga, 'b')]);
    });
  }
  if(p.cr){
    if(p.cd) r.push([seg('  — e inoltre —', 'd')]);
    p.cr.forEach(voce => avvolgi(voce, '  ', '   ')
      .forEach(l => r.push([seg(l, 'b')])));
  }
  return {righe: r, sottopagine: 1, persona: p};
}

/* ---------- ricontrollo dal vivo su Wikidata ----------
   Il sito e' un file fermo, ma Wikidata risponde alle chiamate del browser:
   il tasto rilegge lo stato dei viventi e di quelli di sorte ignota, e segna
   chi nel frattempo se n'e' andato. Il risultato resta nel browser, il file
   sul disco non viene toccato. */
const ENDPOINT = 'https://query.wikidata.org/sparql';
const CHIAVE_SALVATAGGIO = 'duri-a-morire/aggiornamenti';
let ultimoControllo = null;
let avanzamento = {fase: 'fermo', cambi: [], messaggio: ''};

function leggiSalvati(){
  try { return JSON.parse(localStorage.getItem(CHIAVE_SALVATAGGIO) || 'null'); }
  catch(e){ return null; }
}
// REGOLA FERMA: il ricontrollo puo' solo aggiungere morti, mai toglierne.
// Una data si scrive unicamente dove non ce n'e' gia' una, e nessuno torna
// dai defunti ai viventi. Se una fonte tace su qualcuno, il silenzio non
// cancella cio' che un'altra fonte ha gia' certificato.
function applicaCambi(cambi){
  let n = 0;
  cambi.forEach(c => {
    const p = perQid[c.q];
    if(p && !p.d && c.d){ p.d = c.d; p.dp = c.dp; p.s = 2; p.nuovo = 1; n++; }
  });
  return n;
}
function dataDaWikidata(t, prec){
  const a = t.slice(0, 4), m = t.slice(5, 7), g = t.slice(8, 10);
  if(prec >= 11) return [a + '-' + m + '-' + g, 'giorno'];
  if(prec === 10) return [a + '-' + m, 'mese'];
  return [a, 'anno'];
}

const attendi = ms => new Promise(r => setTimeout(r, ms));

// fetch da solo non ha un tempo massimo: se l'altro capo non risponde si
// aspetta per sempre, e il tasto resta appeso senza dire niente.
async function chiedi(url, opzioni, secondi){
  const taglio = new AbortController();
  const orologio = setTimeout(() => taglio.abort(), (secondi || 45) * 1000);
  try {
    return await fetch(url, Object.assign({signal: taglio.signal}, opzioni || {}));
  } catch(e){
    throw (e.name === 'AbortError'
      ? new Error('nessuna risposta entro ' + (secondi || 45) + ' secondi') : e);
  } finally {
    clearTimeout(orologio);
  }
}

// L'endpoint pubblico di Wikidata e' generoso ma capriccioso: ogni tanto
// risponde 429 o 502 e basta riprovare tra qualche secondo.
async function interroga(qids, tentativi){
  const query = 'SELECT ?p ?morte ?prec WHERE { VALUES ?p { ' +
    qids.map(q => 'wd:' + q).join(' ') +
    ' } ?p p:P570/psv:P570 [ wikibase:timeValue ?morte ; wikibase:timePrecision ?prec ] . }';
  let ultimo;
  for(let i = 0; i < (tentativi || 4); i++){
    if(i) await attendi(2500 * i);
    try {
      const r = await chiedi(ENDPOINT, {method: 'POST', headers: {
          'Accept': 'application/sparql-results+json',
          'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'query=' + encodeURIComponent(query)}, 45);
      if(!r.ok){ ultimo = new Error('Wikidata ha risposto ' + r.status); continue; }
      const j = await r.json();
      return j.results.bindings.map(b => ({
        q: b.p.value.split('/').pop(), t: b.morte.value, prec: +b.prec.value}));
    } catch(e){ ultimo = e; }
  }
  throw ultimo;
}

// La Camera risponde anche alle chiamate del browser (il Senato no, non manda
// le intestazioni che servono). Le si chiede chi e' morto di recente, e la
// risposta si aggancia per identificativo: nessun nome da riaccoppiare qui.
const CAMERA = 'https://dati.camera.it/sparql';

async function interrogaCamera(dal){
  const query = 'PREFIX foaf: <http://xmlns.com/foaf/0.1/> ' +
    'PREFIX bio: <http://purl.org/vocab/bio/0.1/> ' +
    'SELECT ?pers ?morte WHERE { ?pers a foaf:Person ; bio:Death ?d . ' +
    '?d bio:date ?morte . FILTER(STR(?morte) > "' + dal + '") }';
  const u = CAMERA + '?query=' + encodeURIComponent(query) +
    '&format=' + encodeURIComponent('application/sparql-results+json');
  const r = await chiedi(u, {headers: {'Accept': 'application/sparql-results+json'}}, 60);
  if(!r.ok) throw new Error('la Camera ha risposto ' + r.status);
  const j = await r.json();
  const fuori = {};
  j.results.bindings.forEach(b => {
    const id = (b.pers.value.split('/p')[1] || '').trim();
    const g = b.morte.value.trim();
    if(id && /^\d{8}$/.test(g))
      fuori[id] = g.slice(0,4) + '-' + g.slice(4,6) + '-' + g.slice(6,8);
  });
  return fuori;
}

async function controllaOra(){
  if(avanzamento.fase === 'corso') return;
  avanzamento = {fase: 'corso', cambi: [], messaggio: 'preparo…'};
  stato = {pagina: 600, sub: 0, qid: null, el: null, filtro: stato.filtro};
  disegna();
  try {
    const daVedere = viventi.concat(ignoti).map(p => p.q);
    const lotti = [];
    for(let i = 0; i < daVedere.length; i += 250) lotti.push(daVedere.slice(i, i + 250));
    const trovati = [];
    for(let i = 0; i < lotti.length; i++){
      avanzamento.messaggio = 'Wikidata, gruppo ' + (i + 1) + ' di ' + lotti.length;
      disegna();
      (await interroga(lotti[i])).forEach(r => {
        const d = dataDaWikidata(r.t, r.prec);
        trovati.push({q: r.q, d: d[0], dp: d[1]});
      });
    }
    // Secondo giro, sul registro della Camera: due anni indietro, perche' un
    // decesso puo' essere registrato parecchio dopo che e' avvenuto.
    const inizio = new Date(DATI.generato);
    inizio.setFullYear(inizio.getFullYear() - 2);
    avanzamento.messaggio = 'ora il registro della Camera';
    disegna();
    try {
      const registro = await interrogaCamera(
        inizio.toISOString().slice(0,10).replace(/-/g, ''));
      viventi.concat(ignoti).forEach(p => {
        if(p.ci && registro[p.ci]) trovati.push({q: p.q, d: registro[p.ci], dp: 'giorno'});
      });
    } catch(e){
      // Se la Camera non risponde resta comunque valido il giro su Wikidata.
      avanzamento.camera = e.message;
    }

    const cambi = trovati.filter(c => perQid[c.q] && !perQid[c.q].d);
    const primaDefunti = defunti.length;
    applicaCambi(cambi);
    ricalcola();
    // Rete di sicurezza, non dovrebbe scattare mai: se per un difetto il
    // conto dei defunti scendesse, si ricarica e si perde l'aggiornamento
    // invece di mostrare gente resuscitata.
    if(defunti.length < primaDefunti){
      avanzamento = {fase: 'errore', cambi: [],
        messaggio: 'il conto dei defunti sarebbe sceso'};
      disegna();
      return;
    }
    ultimoControllo = new Date().toISOString();
    const prima = leggiSalvati();
    try {
      localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify({
        quando: ultimoControllo,
        cambi: (prima && prima.cambi ? prima.cambi : []).concat(cambi)}));
    } catch(e){ /* niente localStorage: pazienza, vale per questa sessione */ }
    avanzamento = {fase: 'fatto', cambi: cambi, messaggio: ''};
  } catch(e){
    avanzamento = {fase: 'errore', cambi: [], messaggio: e.message};
  }
  disegna();
}

PAGINE[600] = () => {
  const r = [titolo('RICONTROLLO SU WIKIDATA'), vuota()];
  if(avanzamento.fase === 'fermo'){
    r.push([seg(' Rilegge lo stato di ' + (viventi.length + ignoti.length) +
                ' persone', 'c')]);
    r.push([seg(' su Wikidata e sul registro della', 'c')]);
    r.push([seg(' Camera, e segna chi se n’è andato', 'c')]);
    r.push([seg(' dopo il ' + dataIt(DATI.generato) + '.', 'c')]);
    r.push(vuota());
    r.push([seg(' Puo’ solo aggiungere morti, mai', 'v')]);
    r.push([seg(' toglierne: se una fonte tace, il', 'v')]);
    r.push([seg(' silenzio non cancella niente.', 'v')]);
    r.push(vuota());
    r.push([seg(' Premi AGGIORNA, qui sotto.', 'g')]);
    if(location.protocol === 'file:'){
      r.push(vuota());
      r.push([seg(' ATTENZIONE ', 'invr')]);
      r.push([seg(' Aperto col doppio clic dal disco,', 'r')]);
      r.push([seg(' il browser vieta le chiamate a', 'r')]);
      r.push([seg(' Wikidata. Funziona solo quando il', 'r')]);
      r.push([seg(' sito è servito da un indirizzo.', 'r')]);
    }
  } else if(avanzamento.fase === 'corso'){
    r.push([seg(' Interrogo Wikidata…', 'g')]);
    r.push([seg(' ' + avanzamento.messaggio, 'c')]);
  } else if(avanzamento.fase === 'errore'){
    r.push([seg(' NON RIUSCITO ', 'invr')]);
    r.push(vuota());
    r.push([seg(' ' + tronca(avanzamento.messaggio, W - 2), 'r')]);
    r.push(vuota());
    r.push([seg(' Wikidata non risponde. Succede:', 'd')]);
    r.push([seg(' riprova fra qualche minuto.', 'd')]);
  } else {
    if(!avanzamento.cambi.length){
      r.push([seg(' Nessuna novità: sono ancora tutti', 'v')]);
      r.push([seg(' al loro posto.', 'v')]);
    } else {
      r.push([seg(' ' + avanzamento.cambi.length + ' NOVITÀ ', 'invr')]);
      r.push(vuota());
      avanzamento.cambi.slice(0, 12).forEach(c => {
        const p = perQid[c.q];
        r.push([seg('  '), {t: tronca(p.n, 24).padEnd(24), c: 'b', link: p.q},
                seg(dataIt(p.d, p.dp).padStart(12), 'r')]);
      });
    }
  }
  if(avanzamento.camera){
    r.push(vuota());
    r.push([seg(' la Camera non ha risposto:', 'd')]);
    r.push([seg(' ' + tronca(avanzamento.camera, W - 2), 'd')]);
  }
  if(ultimoControllo){
    r.push(vuota());
    r.push([seg(' ultimo controllo: ' +
      new Date(ultimoControllo).toLocaleString('it-IT'), 'd')]);
  }
  return {righe: r, sottopagine: 1};
};

/* ---------- elenchi filtrati ----------
   Sono le pagine che si aprono toccando un numero: un conteggio da solo dice
   poco, i nomi dietro al conteggio dicono tutto. */
function paginaFiltrata(chiave){
  const i = chiave.indexOf(':');
  const tipo = chiave.slice(0, i), valore = chiave.slice(i + 1);
  let elenco = [], intestazione = 'ELENCO', esteso = '';
  if(tipo === 'mandato'){
    elenco = perNascita(perMandato(valore).filter(p => p.s === 1));
    esteso = perEsteso(valore);
    intestazione = 'VIVI — ' + valore;
  } else if(tipo === 'partito'){
    elenco = perNascita(viventi.filter(p => p.p === valore));
    esteso = perEsteso(valore);
    intestazione = 'VIVI — ' + valore;
  } else if(tipo === 'hof'){
    elenco = perNascita(hof.filter(p => p.p === valore && p.s === 1));
    esteso = perEsteso(valore);
    intestazione = 'HALL OF FAME — ' + valore;
  } else if(tipo === 'mortipartito'){
    elenco = defunti.filter(p => p.p === valore)
      .sort((a, b) => (a.d || '') < (b.d || '') ? 1 : -1);
    esteso = perEsteso(valore);
    intestazione = 'DEFUNTI — ' + valore;
  } else if(tipo === 'morti'){
    elenco = defunti.filter(p => anno(p.d) === +valore)
      .sort((a, b) => (a.d || '') < (b.d || '') ? -1 : 1);
    intestazione = 'MORTI NEL ' + valore;
  }
  const quante = elenco.length === 1 ? '1 persona' : elenco.length + ' persone';
  return paginaLista(() => elenco, intestazione,
                     esteso ? tronca(esteso, W - 14) + ', ' + quante : quante);
}

/* ---------- motore ---------- */
let stato = {pagina: 100, sub: 0, qid: null, el: null, filtro: ''};

function risultatiRicerca(testo){
  const t = testo.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const trovati = P.filter(p => p.n.toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').indexOf(t) >= 0);
  return paginaLista(trovati, 'RICERCA: ' + tronca(testo.toUpperCase(), 24),
    trovati.length + ' risultati');
}

function disegna(){
  let costruttore, extra = '';
  if(stato.qid) costruttore = () => scheda(stato.qid);
  else if(stato.el) costruttore = paginaFiltrata(stato.el);
  else if(stato.pagina === 150 && stato.filtro) costruttore = risultatiRicerca(stato.filtro);
  else costruttore = PAGINE[stato.pagina] || (() => ({
    righe: [titolo('PAGINA ' + stato.pagina), vuota(),
      [seg(' Non esiste. Prova con la 100.', 'r')]], sottopagine: 1}));

  const res = costruttore(stato.sub);
  if(stato.sub >= res.sottopagine) stato.sub = 0;

  const etichettaPag = stato.qid ? 'SCHEDA'
    : (stato.el ? 'ELENCO' : 'P.' + stato.pagina);
  const dataOggi = OGGI.getDate() + ' ' + MESI[OGGI.getMonth()].toUpperCase() + ' ' +
    String(OGGI.getFullYear()).slice(2);
  const testata = rigaHtml(sxdx(' ' + TESTATA, etichettaPag + '  ' + dataOggi + ' ', 'inv', 'inv'));

  const corpo = res.righe.map(rigaHtmlConLink).join('\n');
  document.getElementById('schermo').innerHTML = testata + '\n' + corpo;

  // foto e rimando alla fonte vivono fuori dalla griglia a 40 colonne
  const box = document.getElementById('extra');
  if(res.persona){
    const p = res.persona;
    // niente loading="lazy": la foto sta sotto la piega e non partirebbe mai
    box.innerHTML = (p.f ? '<img src="' + p.f + '" alt="' + esc(p.n) + '">' : '') +
      '<div class="via">' + (p.w ? '<a href="' + p.w + '" target="_blank" rel="noopener">voce su Wikipedia</a><br>' : '') +
      '<a href="https://www.wikidata.org/wiki/' + p.q + '" target="_blank" rel="noopener">record Wikidata ' + p.q + '</a></div>';
  } else box.innerHTML = '';

  // le frecce compaiono solo dove servono: spente sembravano rotte
  const nsub = res.sottopagine;
  document.getElementById('sub').style.display = nsub > 1 ? 'flex' : 'none';
  document.getElementById('subetichetta').textContent = (stato.sub + 1) + ' / ' + nsub;
  document.getElementById('pieno').textContent =
    ' — ' + P.length + ' schede, aggiornate il ' + dataIt(DATI.generato) + '.';
  const rimando = document.getElementById('colofone');
  if(COLOFONE && !rimando.dataset.pronto){
    rimando.dataset.pronto = '1';
    rimando.innerHTML = ' <a class="n" data-p="700" href="#p700">Chi fa questo sito</a>';
    rimando.addEventListener('click', e => {
      const a = e.target.closest('a.n');
      if(a){ e.preventDefault(); vaiA(700); }
    });
  }
}

/* ---------- cronologia del browser ----------
   Il sito e' una pagina sola che cambia contenuto, quindi senza far niente la
   freccia indietro del browser porta fuori dal sito invece che alla schermata
   precedente. Ogni spostamento viene registrato nella cronologia, e ognuno ha
   il suo indirizzo: cosi' la freccia funziona e le pagine si possono anche
   mandare a qualcuno.

     #p240              una pagina
     #Q3432264          la scheda di una persona
     #l/partito:DC      un elenco filtrato
     #cerca/rossi       una ricerca

   Le sottopagine non aggiungono una voce ma sostituiscono l'ultima: sfogliare
   duecento sottopagine non deve seppellire il punto da cui si e' arrivati. */

const STATO_INIZIALE = {pagina: 100, sub: 0, qid: null, el: null, filtro: ''};

function statoDaIndirizzo(h){
  h = (h || '').replace(/^#/, '');
  if(!h) return null;
  if(/^p\d{3}$/i.test(h))
    return Object.assign({}, STATO_INIZIALE, {pagina: +h.slice(1)});
  if(/^Q\d+$/i.test(h))
    return Object.assign({}, STATO_INIZIALE, {qid: h.toUpperCase()});
  if(h.indexOf('l/') === 0)
    return Object.assign({}, STATO_INIZIALE, {el: decodeURIComponent(h.slice(2))});
  if(h.indexOf('cerca/') === 0)
    return Object.assign({}, STATO_INIZIALE,
      {pagina: 150, filtro: decodeURIComponent(h.slice(6))});
  return null;
}

function indirizzoDiStato(s){
  if(s.qid) return '#' + s.qid;
  if(s.el) return '#l/' + encodeURIComponent(s.el);
  if(s.pagina === 150 && s.filtro) return '#cerca/' + encodeURIComponent(s.filtro);
  return '#p' + s.pagina;
}

function mostra(nuovo, spingi){
  stato = nuovo;
  const dove = indirizzoDiStato(stato);
  try {
    if(spingi) history.pushState(stato, '', dove);
    else history.replaceState(stato, '', dove);
  } catch(e){
    // aperto da disco certi browser non lasciano riscrivere l'indirizzo:
    // la cronologia si tiene lo stato lo stesso, ed e' quello che conta
    try { spingi ? history.pushState(stato, '') : history.replaceState(stato, ''); }
    catch(e2){ /* niente cronologia: il sito funziona comunque */ }
  }
  disegna();
}

function vaiA(n){
  mostra(Object.assign({}, STATO_INIZIALE, {pagina: n, filtro: stato.filtro}), true);
}
function apriScheda(q){
  mostra(Object.assign({}, stato, {qid: q, sub: 0}), true);
}
function apriLista(chiave){
  mostra(Object.assign({}, stato, {qid: null, el: chiave, sub: 0}), true);
}
function vaiASottopagina(n){
  mostra(Object.assign({}, stato, {sub: Math.max(0, n)}), false);
}

window.addEventListener('popstate', e => {
  stato = e.state || statoDaIndirizzo(location.hash) ||
          Object.assign({}, STATO_INIZIALE);
  disegna();
});

document.getElementById('schermo').addEventListener('click', e => {
  const a = e.target.closest('a.n');
  if(!a) return;
  e.preventDefault();
  if(a.dataset.p) vaiA(+a.dataset.p);
  else if(a.dataset.l) apriLista(a.dataset.l);
  else apriScheda(a.dataset.q);
});
document.querySelectorAll('.fast button').forEach(b =>
  b.addEventListener('click', () => vaiA(+b.dataset.p)));
document.getElementById('pag').addEventListener('input', e => {
  const v = e.target.value.replace(/\D/g, '');
  e.target.value = v;
  // svuotare il campo dopo il salto: altrimenti resta pieno a tre cifre
  // e la digitazione successiva non fa piu' scattare niente.
  if(v.length === 3){ vaiA(+v); e.target.value = ''; }
});
document.getElementById('cerca').addEventListener('input', e => {
  const testo = e.target.value.trim();
  stato.filtro = testo;
  // una voce di cronologia per ogni lettera digitata sarebbe un'inondazione:
  // la ricerca sostituisce sempre l'ultima
  if(testo.length >= 2)
    mostra(Object.assign({}, stato, {qid: null, el: null, pagina: 150, sub: 0}), false);
});
document.getElementById('prev').addEventListener('click', () => vaiASottopagina(stato.sub - 1));
document.getElementById('next').addEventListener('click', () => vaiASottopagina(stato.sub + 1));
document.addEventListener('keydown', e => {
  if(document.activeElement.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight') vaiASottopagina(stato.sub + 1);
  if(e.key === 'ArrowLeft') vaiASottopagina(stato.sub - 1);
});
document.getElementById('aggiorna').addEventListener('click', controllaOra);

// i ricontrolli gia' fatti in questo browser valgono anche dopo un ricarico
const salvato = leggiSalvati();
if(salvato && salvato.cambi && salvato.cambi.length){
  applicaCambi(salvato.cambi);
  ultimoControllo = salvato.quando;
  ricalcola();
}

// Un indirizzo con l'ancora apre direttamente quella schermata: le pagine
// sono condivisibili, e il ricaricamento non riporta all'indice.
stato = statoDaIndirizzo(location.hash) || stato;
mostra(stato, false);

/* Il file e' uno solo e il suo indirizzo non cambia mai, quindi un browser
   puo' restare attaccato a una copia vecchia anche dopo l'aggiornamento
   notturno. La pagina se ne accorge da sola: chiede la propria versione
   scavalcando la cache e, se ne esiste una piu' fresca, si ricarica una volta
   sola. Il segnaposto in sessione evita che si ricarichi all'infinito. */
async function controllaVersione(){
  try {
    const r = await chiedi(location.pathname + '?v=' + Date.now(),
                           {cache: 'no-store'}, 20);
    if(!r.ok) return;
    const testo = await r.text();
    const m = testo.match(/"generato":"(\d{4}-\d{2}-\d{2})"/);
    if(!m) return;
    if(m[1] > DATI.generato){
      if(sessionStorage.getItem('duri-ricaricato')) return;
      sessionStorage.setItem('duri-ricaricato', '1');
      location.reload();
    } else {
      sessionStorage.removeItem('duri-ricaricato');
    }
  } catch(e){ /* se non si riesce, pazienza: si guarda quello che c'e' */ }
}
setTimeout(controllaVersione, 1500);
